name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: release / build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install reproducible build tools
        run: python -m pip install --upgrade pip build twine
      - name: Validate public release policy
        run: python scripts/check_public_release.py
      - name: Test source tree
        run: |
          python -m pip install ".[test]"
          python -m compileall -q application cli data domain estimation evaluation experiments inference infrastructure models transfer
          pytest
      - name: Build and validate distributions
        run: |
          python -m build
          twine check dist/*
      - name: Install the built wheel in a clean environment
        run: |
          python -m venv .release-venv
          .release-venv/bin/python -m pip install --upgrade pip
          .release-venv/bin/python -m pip install dist/*.whl
          .release-venv/bin/learnable-sde --help
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  publish:
    name: release / publish
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist-${{ github.sha }}
          path: dist
      - name: Generate checksums
        run: (cd dist && sha256sum * > SHA256SUMS)
      - name: Publish immutable tag assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes dist/*
