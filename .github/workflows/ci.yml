name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  policy:
    name: policy / traceability and public boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Explain policy validation
        run: |
          {
            echo "## Policy gate"
            echo "Validates PR traceability and rejects non-public artifacts or identifiers."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Validate PR traceability
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.head_ref }}
        run: python scripts/check_pr_title.py "$PR_TITLE" "$PR_BRANCH"
      - name: Public release scan
        run: python scripts/check_public_release.py
  python-suite:
    name: suite (${{ matrix.python-version }}, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    # Preserve the job limit and all individual worker/watchdog deadlines.
    # Each shard collects the COMPLETE inventory before selecting its partition.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: PSDE-SDE
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          path: PSDE-SDE
      - name: Check out paired Paper implementation
        uses: actions/checkout@v7
        with:
          repository: HuAzurestar/learnable-sde-paper-to-predict-movement
          ref: 0a82fc311378e9ada6682a51bb33d678d61886d0
          path: TSDE-SDE
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Explain Python validation
        run: |
          {
            echo "## Python gate"
            echo "Installs the declared test extra, byte-compiles public packages, and runs pytest."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Compile
        run: python -m compileall -q application cli data domain estimation evaluation experiments inference infrastructure models transfer
      - name: Native source read boundaries
        run: python -B scripts/check_research_source_reads.py
      - name: Test
        run: python scripts/pytest_shards.py run --index ${{ matrix.shard }} --count 4 --report "${{ runner.temp }}/pytest-report/shard-${{ matrix.shard }}.json"
      - name: Preserve complete collection and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.python-version }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/pytest-report/*
          if-no-files-found: error
          retention-days: 14
  python:
    # Keep the original required version-check names. No missing/failed shard
    # may pass: verify the same complete inventory and exactly-once execution.
    name: test (${{ matrix.python-version }})
    if: ${{ always() }}
    needs: [python-suite]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          pattern: pytest-${{ matrix.python-version }}-*
          path: shard-reports
          merge-multiple: true
      - name: Require complete successful version inventory
        run: python scripts/pytest_shards.py verify --count 4 --revision "${{ github.sha }}" --reports shard-reports
  required:
    name: required
    if: ${{ always() }}
    needs: [policy, python]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Explain required-check result
        run: |
          {
            echo "## Required gate"
            echo "Passes only when the policy gate and the complete Python version matrix succeed."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Require successful gates
        env:
          POLICY: ${{ needs.policy.result }}
          PYTHON: ${{ needs.python.result }}
        run: test "$POLICY" = success && test "$PYTHON" = success
