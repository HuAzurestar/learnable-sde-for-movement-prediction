name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  policy:
    name: policy / traceability and public boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Explain policy validation
        run: |
          {
            echo "## Policy gate"
            echo "Validates PR traceability and rejects non-public artifacts or identifiers."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Validate PR traceability
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.head_ref }}
        run: python scripts/check_pr_title.py "$PR_TITLE" "$PR_BRANCH"
      - name: Public release scan
        run: python scripts/check_public_release.py
  python-shards:
    name: suite (${{ matrix.python-version }}, partition ${{ matrix.partition }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: PSDE-SDE
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        partition: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          path: PSDE-SDE
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check out paired Paper implementation
        uses: actions/checkout@v7
        with:
          repository: HuAzurestar/learnable-sde-paper-to-predict-movement
          ref: 260b6c78d6f6ba5198471fc2e2edbd0c71ca442e
          path: TSDE-SDE
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Explain Python validation
        run: |
          {
            echo "## Python gate"
            echo "Collects the entire suite and runs one complete module-stable partition."
            echo "Independent version gates require the disjoint union of all terminal outcomes."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Compile
        run: python -m compileall -q application cli data domain estimation evaluation experiments inference infrastructure models transfer
      - name: Native source read boundaries
        run: python -B scripts/check_research_source_reads.py
      - name: Test
        run: >-
          python scripts/ci_pytest_partition.py run --count 4
          --index ${{ matrix.partition }}
          --report "${{ runner.temp }}/coverage-${{ matrix.python-version }}-${{ matrix.partition }}.json"
      - name: Preserve coverage outcomes, including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-${{ matrix.python-version }}-${{ matrix.partition }}
          path: ${{ runner.temp }}/coverage-${{ matrix.python-version }}-${{ matrix.partition }}.json
          if-no-files-found: error
          retention-days: 14
  python:
    # Keep these check names aligned with the required status contexts on main.
    name: test (${{ matrix.python-version }})
    if: ${{ always() }}
    needs: [python-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: PSDE-SDE
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          path: PSDE-SDE
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check out paired Paper implementation
        uses: actions/checkout@v7
        with:
          repository: HuAzurestar/learnable-sde-paper-to-predict-movement
          ref: 260b6c78d6f6ba5198471fc2e2edbd0c71ca442e
          path: TSDE-SDE
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Require every suite worker to succeed
        env:
          SHARDS: ${{ needs.python-shards.result }}
        run: test "$SHARDS" = success
      - name: Install independent full-collection environment
        run: python -m pip install -e ".[test]"
      - name: Download this version's coverage receipts
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: coverage-${{ matrix.python-version }}-*
          path: ${{ runner.temp }}/pytest-coverage
          digest-mismatch: error
      - name: Independently recollect and verify exhaustive coverage
        run: >-
          python scripts/ci_pytest_partition.py verify --count 4
          --directory "${{ runner.temp }}/pytest-coverage"
  required:
    name: required
    if: ${{ always() }}
    needs: [policy, python]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Explain required-check result
        run: |
          {
            echo "## Required gate"
            echo "Passes only when the policy gate and the complete Python version matrix succeed."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Require successful gates
        env:
          POLICY: ${{ needs.policy.result }}
          PYTHON: ${{ needs.python.result }}
        run: test "$POLICY" = success && test "$PYTHON" = success
