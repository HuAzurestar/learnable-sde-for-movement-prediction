[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "learnable-sde"
version = "0.2.0"
description = "Composable OOP framework for learnable stochastic differential equations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "duckdb>=1.0",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14",
  "PyYAML>=6.0",
  "torch>=2.1",
]

[project.urls]
Homepage = "https://github.com/HuAzurestar/learnable-sde-for-movement-prediction"
Repository = "https://github.com/HuAzurestar/learnable-sde-for-movement-prediction.git"
Issues = "https://github.com/HuAzurestar/learnable-sde-for-movement-prediction/issues"

[project.optional-dependencies]
test = [
  "pytest>=7.4",
  "psutil>=5.9",
  "threadpoolctl>=3",
  "PyMuPDF>=1.23",
  "matplotlib>=3.7",
  "Pillow>=9.5",
  "shapely==2.1.2",
  "rasterio==1.4.4",
]
benchmark = ["psutil>=5.9", "threadpoolctl>=3"]

[project.scripts]
learnable-sde = "cli.__main__:main"

[tool.setuptools]
py-modules = ["config", "numerics", "registry"]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "application*",
  "cli*",
  "data*",
  "domain*",
  "estimation*",
  "evaluation*",
  "experiments*",
  "inference*",
  "infrastructure*",
  "models*",
  "transfer*",
]
exclude = ["tests*"]

[tool.setuptools.package-data]
"experiments.pirc25" = ["ui/*.html", "ui/*.css", "ui/*.js"]
